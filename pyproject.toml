[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aura-life"
version = "0.2.0"
description = "Agent life-simulation engine: mood, energy, goals, identity, planning, and daily life for autonomous personas"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "tzdata; sys_platform == 'win32'",   # zoneinfo has no system tz database on Windows
]

[project.optional-dependencies]
scheduler = ["apscheduler>=3.11"]       # LifeScheduler degrades to a no-op without it (life_scheduler.py:11-16)

[project.urls]
Homepage = "https://github.com/Redrum624/aura-life"
Source = "https://github.com/Redrum624/aura-life"
Issues = "https://github.com/Redrum624/aura-life/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
