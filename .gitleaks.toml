# gitleaks configuration
#
# The default rule set, unmodified. aura-life has no allowlist because it
# needs none: the package is pure Python with no vendored upstream code, no
# test-vector fixtures, and no crypto material. The two parity goldens under
# tests/fixtures/ are life-simulation state snapshots — mood, energy, schedule
# — and carry nothing that resembles a credential.
#
# Contrast with the two sibling configs, both of which exist only to pin
# false positives this package cannot produce:
#   - Aura's allowlists vendored llama.cpp and Vulkan-Headers, whose example
#     keys and extension string tables trip the entropy rules.
#   - wellness_companion's pins three known-answer crypto test vectors.
#
# If an allowlist is ever needed here, pin the exact bytes and the exact file
# with condition = "AND", never a bare path — a path exemption would hide a
# real secret added to that file later.
#
# Baseline: full-history scan on 2026-08-26 at f7b2327 reported
# "28 commits scanned / no leaks found".

[extend]
useDefault = true
